# Solo desarrollo: añade Evolution API al despliegue. No usar para alertas reales
# (incumple los Términos de WhatsApp; ver docs/evolution-api.md).
#
#   docker compose -f compose.yaml -f compose.evolution.yaml up -d --build
#
# Requiere en el .env: EVOLUTION_APIKEY, EVOLUTION_POSTGRES_PASSWORD y
# WHATSAPP_EVOLUTION_INSTANCE, además de un ALTER del CHECK de `proveedor` si esa
# base no admite todavía EVOLUTION_API.

services:
  api:
    environment:
      WHATSAPP_DRIVER: evolution
      # Evolution vive en la red interna: nunca se expone a internet.
      WHATSAPP_EVOLUTION_URL: http://evolution-api:8080
      WHATSAPP_EVOLUTION_APIKEY: ${EVOLUTION_APIKEY:?Define EVOLUTION_APIKEY en el .env}
      WHATSAPP_EVOLUTION_INSTANCE: ${WHATSAPP_EVOLUTION_INSTANCE:?Define WHATSAPP_EVOLUTION_INSTANCE en el .env}
    depends_on:
      evolution-api:
        condition: service_started

  evolution-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:?Define EVOLUTION_POSTGRES_PASSWORD en el .env}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evolution']
      interval: 5s
      timeout: 5s
      retries: 12

  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
    # Solo en loopback: se administra por túnel SSH, no desde internet.
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      SERVER_URL: http://evolution-api:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_APIKEY:?Define EVOLUTION_APIKEY en el .env}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_POSTGRES_PASSWORD}@evolution-postgres:5432/evolution?schema=evolution_api
      CACHE_REDIS_ENABLED: 'false'
      TELEMETRY_ENABLED: 'false'
      LOG_LEVEL: ERROR,WARN,INFO
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_pg:
  evolution_instances:
